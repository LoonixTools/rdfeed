<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- the tile, in the style of face-unlock -->
    <linearGradient id="wall" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0c2f7a"/>
      <stop offset="0.55" stop-color="#1663d6"/>
      <stop offset="1" stop-color="#1fb8d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6fa8ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6fa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.1" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#3ee8d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3ee8d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- the window -->
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f5"/>
    </linearGradient>
    <clipPath id="tile"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06163a" flood-opacity="0.35"/>
    </filter>
    <filter id="windowShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- the tile -->
  <g filter="url(#tileShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#wall)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="24" y="24" width="464" height="464" fill="url(#glow)"/>
    <rect x="24" y="24" width="464" height="464" fill="url(#teal)"/>
    <rect x="24" y="24" width="464" height="464" fill="url(#sheen)"/>
  </g>
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- a window, with its title bar -->
  <rect x="96" y="110" width="320" height="292" rx="56" fill="url(#window)" filter="url(#windowShadow)"/>
  <rect x="97" y="111" width="318" height="290" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="146" cy="156" r="9" fill="#ffffff" fill-opacity="0.32"/>
  <circle cx="176" cy="156" r="9" fill="#ffffff" fill-opacity="0.32"/>
  <circle cx="206" cy="156" r="9" fill="#ffffff" fill-opacity="0.32"/>

  <!-- the apps in it, and the feed they come from -->
  <g fill="url(#glyph)">
    <rect x="152" y="196" width="80" height="80" rx="20"/>
    <rect x="152" y="294" width="80" height="80" rx="20" fill-opacity="0.9"/>
    <rect x="250" y="294" width="80" height="80" rx="20" fill-opacity="0.8"/>
  </g>
  <g fill="none" stroke="url(#glyph)" stroke-linecap="round" stroke-width="13">
    <path d="M262 204 A 64 64 0 0 1 326 268"/>
    <path d="M262 233 A 35 35 0 0 1 297 268"/>
  </g>
  <circle cx="268" cy="262" r="10" fill="url(#glyph)"/>
</svg>
